# Alembic config. The database URL is set in env.py from the DATABASE_URL env var.
[alembic]
script_location = alembic
prepend_sys_path = .
# Fallback (overridden by DATABASE_URL in env.py):
sqlalchemy.url = sqlite:///./alembic-local.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
