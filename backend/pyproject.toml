[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-clipper-backend"
version = "0.1.0"
description = "AI Clipper backend - local self-hosted short-form video pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "celery[redis]>=5.3",
    "redis>=5.0",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "moto[s3,server]>=5.0"]
whisper = ["faster-whisper>=1.0"]
ml = ["scikit-learn>=1.4", "joblib>=1.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "real_services: tests that require real external services/binaries (skipped by default; enable with RUN_REAL_INTEGRATION=1)",
]
